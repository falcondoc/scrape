name: Update Source Playlists

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull --rebase origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror external sources → playlist1..N
        run: python scripts/mirror_sources.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist*.m3u playlist*.json combined_playlist.m3u combined_meta.json sources_status.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh mirrored playlists [skip ci]"

          git pull --rebase origin main || true

          for i in 1 2 3; do
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed (try $i), rebase + retry..."
            git pull --rebase origin main || true
            sleep 3
          done
          echo "Push failed after retries" >&2
          exit 1
