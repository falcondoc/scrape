name: Update playlist3 (Pornhao)

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      max_models:
        default: "8"
        required: false
      max_per_model:
        default: "8"
        required: false
      pages:
        default: "1"
        required: false
      workers:
        default: "4"
        required: false

concurrency:
  group: pl3
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape Pornhao
        env:
          MM: ${{ github.event.inputs.max_models || '8' }}
          MPM: ${{ github.event.inputs.max_per_model || '8' }}
          PAGES: ${{ github.event.inputs.pages || '1' }}
          WORKERS: ${{ github.event.inputs.workers || '4' }}
        run: |
          python scripts/scrape_pornhao.py --max-models "$MM" --max-per-model "$MPM" --pages "$PAGES" --workers "$WORKERS"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist3.m3u playlist3.json playlist3_meta.json || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh playlist3 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
