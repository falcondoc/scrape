name: Update playlist1 (Kaamdesi)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh | batch | reset"
        required: false
        default: "refresh"
        type: choice
        options: [refresh, batch, reset]
      workers:
        default: "10"
        required: false
      refresh_pages:
        default: "3"
        required: false
      batch_pages:
        default: "8"
        required: false

concurrency:
  group: pl1
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape
        env:
          MODE: ${{ github.event.inputs.mode || 'refresh' }}
          WORKERS: ${{ github.event.inputs.workers || '10' }}
          RP: ${{ github.event.inputs.refresh_pages || '3' }}
          BP: ${{ github.event.inputs.batch_pages || '8' }}
        run: |
          python scripts/scrape_desi.py --mode "$MODE" --workers "$WORKERS" --refresh-pages "$RP" --batch-pages "$BP"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist1.m3u playlist1.json playlist1_meta.json scraper_state.json || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh playlist1 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
