name: Update playlist1 (Kaamdesi)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        default: "refresh"
        type: choice
        options: [refresh, batch, reset]
      workers:
        default: "10"

concurrency:
  group: pl1
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/scrape_desi.py --mode "${{ github.event.inputs.mode || 'refresh' }}" --workers "${{ github.event.inputs.workers || '10' }}"
      - run: python scripts/build_combined.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist1.m3u playlist1.json playlist1_meta.json scraper_state.json combined_playlist.m3u || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh playlist1 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
