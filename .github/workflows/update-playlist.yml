name: Update Playlist

on:
  schedule:
    # every 6 hours — tokens usually live a few days; 6h keeps them fresh
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      performers:
        description: 'Comma-separated performers (slug or "First Last"). Empty = use performers.txt'
        required: false
        default: ""
      pages:
        description: "Max pages per performer"
        required: false
        default: "5"

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull --rebase origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build performer list
        id: models
        run: |
          if [ -n "${{ github.event.inputs.performers }}" ]; then
            echo "list=${{ github.event.inputs.performers }}" >> "$GITHUB_OUTPUT"
          elif [ -f performers.txt ]; then
            # strip comments/blank lines, join with comma
            LIST=$(grep -v '^\s*#' performers.txt | grep -v '^\s*$' | tr '\n' ',' | sed 's/,$//')
            echo "list=$LIST" >> "$GITHUB_OUTPUT"
          else
            echo "list=angela-white,brandi-love,lana-rhoades,riley-reid,abella-danger,adriana-chechik,alexis-fawx,nicole-aniston,aletta-ocean,jessa-rhodes" >> "$GITHUB_OUTPUT"
          fi
          echo "Using: $(cat $GITHUB_OUTPUT)"

      - name: Run scraper
        env:
          PAGES: ${{ github.event.inputs.pages || '5' }}
        run: |
          # expand comma list into separate -p args
          IFS=',' read -ra ARR <<< "${{ steps.models.outputs.list }}"
          ARGS=()
          for p in "${ARR[@]}"; do
            p=$(echo "$p" | xargs)
            [ -n "$p" ] && ARGS+=("$p")
          done
          python scripts/build_master_m3u.py -p "${ARGS[@]}" --pages "$PAGES"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u playlist.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh playlist [skip ci]"

          git pull --rebase origin main || true

          for i in 1 2 3; do
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed (try $i), rebase + retry..."
            git pull --rebase origin main || true
            sleep 3
          done
          echo "Push failed after retries" >&2
          exit 1
