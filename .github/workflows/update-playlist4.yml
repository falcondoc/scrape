name: Update playlist4 (Movies catalog)

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Run soft probe (still never empties)"
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: pl4
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh playlist4
        run: |
          if [ "${{ github.event.inputs.probe || 'false' }}" = "true" ]; then
            python scripts/refresh_movies.py --probe
          else
            python scripts/refresh_movies.py
          fi
          python scripts/build_combined.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist4.m3u playlist4_meta.json movies_catalog.json combined_playlist.m3u || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh playlist4 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
