name: Update playlist4 (Live IPTV probe)

on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        default: "20"
        required: false
      import_url:
        description: "Optional one-shot M3U URL to expand catalog"
        default: ""
        required: false

concurrency:
  group: pl4
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live catalog
        env:
          WORKERS: ${{ github.event.inputs.workers || '20' }}
          IMPORT: ${{ github.event.inputs.import_url || '' }}
        run: |
          if [ -n "$IMPORT" ]; then
            python scripts/refresh_live_iptv.py --import-url "$IMPORT" --workers "$WORKERS"
          else
            python scripts/refresh_live_iptv.py --workers "$WORKERS"
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist4.m3u playlist4_meta.json live_catalog.json || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh playlist4 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
