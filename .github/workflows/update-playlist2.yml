name: Update playlist2 (DesiHub)

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Listing pages to scan"
        default: "5"
        required: false
      workers:
        default: "8"
        required: false
      fresh:
        description: "Ignore existing and rebuild"
        default: "false"
        required: false

concurrency:
  group: pl2
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape DesiHub
        env:
          PAGES: ${{ github.event.inputs.pages || '5' }}
          WORKERS: ${{ github.event.inputs.workers || '8' }}
          FRESH: ${{ github.event.inputs.fresh || 'false' }}
        run: |
          EXTRA=""
          [ "$FRESH" = "true" ] && EXTRA="--fresh"
          python scripts/scrape_desihub.py --pages "$PAGES" --workers "$WORKERS" $EXTRA
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist2.m3u playlist2.json playlist2_meta.json desihub_state.json || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh playlist2 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
