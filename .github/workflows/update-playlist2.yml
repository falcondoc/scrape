name: Update playlist2 (Live soft-probe)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        default: "20"
      import_url:
        default: ""
        description: "Optional M3U URL to expand live_catalog"

concurrency:
  group: pl2
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soft probe (never empty)
        env:
          W: ${{ github.event.inputs.workers || '20' }}
          IMP: ${{ github.event.inputs.import_url || '' }}
        run: |
          if [ -n "$IMP" ]; then
            python scripts/refresh_live_iptv.py --import-url "$IMP" --workers "$W"
          else
            python scripts/refresh_live_iptv.py --workers "$W"
          fi
          python scripts/build_combined.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist2.m3u playlist2_meta.json live_catalog.json combined_playlist.m3u || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh playlist2 [skip ci]"
          git pull --rebase origin main || true
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 2; done
          exit 1
